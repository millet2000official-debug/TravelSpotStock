<!doctype html>
<html lang="ja">
<head>
  <!-- 日本語表示とスマートフォンでの表示幅を設定 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ブラウザのテーマ色とページタイトル -->
  <meta name="theme-color" content="#f7f5fb">
  <title>Spotstock</title>
  <!-- 見た目の設定はCSSファイルに分離 -->
  <link rel="stylesheet" href="style.css">
  <!-- ブラウザタブとホーム画面用のアイコン画像 -->
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <!-- アプリ全体の幅と余白を管理する外枠 -->
  <div class="app-shell">
    <!-- アプリ名と新規スポット追加ボタン -->
    <header class="topbar">
      <img src="apple-touch-icon.png" alt="" class="brand-icon">
      <div>
        <h1>Travel Spot Stock</h1>
      </div>
      <button id="addBtn" class="primary">＋ スポット追加</button>
    </header>

    <!-- 検索欄とカテゴリー選択欄を横並びにする -->
    <div class="filter-toolbar">
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="スポットを検索"
        >
      </label>

      <select id="categorySelect" aria-label="カテゴリーで絞り込む">
        <option value="すべて">すべて</option>
      </select>
    </div> 

    <!-- 表示件数とバックアップ操作 -->
    <section class="results-head">
      <h2>保存したスポット <span id="resultCount" class="count">0</span></h2>
      <!-- CSV形式でバックアップを保存・復元する操作 -->
      <div class="data-actions">
        <button id="exportBtn" class="text-button">CSVを書き出す</button>
        <label class="text-button file-label">
          CSVを読み込む
          <input id="importInput" type="file" accept=".csv,text/csv">
        </label>
      </div>
    </section>

    <!-- JavaScriptがスポットカードをここに描画 -->
    <main id="spotList" class="spot-list"></main>
    <!-- データはこのブラウザ内に保存されることを案内 -->
    <p class="footnote">データはこのブラウザ内に保存されます。ブラウザのデータ消去や端末変更に備え、定期的にJSONを書き出してください。</p>
  </div>

  <!-- スポットの追加・編集フォーム -->
  <dialog id="spotDialog">
    <form id="spotForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">SPOT DETAILS</p>
          <h2 id="dialogTitle">スポットを追加</h2>
        </div>
        <button type="button" id="closeDialogBtn" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <!-- 編集対象のIDを画面には見せず保持 -->
      <input id="spotId" type="hidden">

      <!-- ラベルと入力欄を横並びにするフォーム項目 -->
      <label class="form-row">スポット名 <input id="nameInput" required maxlength="160" placeholder="例：気になるカフェ"></label>
      <label class="form-row">カテゴリー
        <select id="categoryInput"></select>
      </label>
      <label class="form-row">Google Mapsリンク <input id="mapUrlInput" type="url" placeholder="https://maps.google.com/..."></label>
      <p class="hint">リンクから名前などを自動取得できない場合は、下の項目を入力してください。</p>
      <label class="form-row">住所 <input id="addressInput" placeholder="住所"></label>
      <label class="form-row">電話番号 <input id="phoneInput" type="tel" placeholder="電話番号"></label>
      <label class="form-row">最寄り駅 <input id="stationInput" placeholder="駅名・徒歩分数など"></label>
      <label class="form-row form-row-top">メモ <textarea id="memoInput" rows="3" placeholder="行きたい理由、気になるメニューなど"></textarea></label>
      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="danger hidden">削除</button>
        <span class="grow"></span>
        <button type="button" id="cancelBtn" class="secondary">キャンセル</button>
        <button type="submit" class="primary">保存する</button>
      </div>
    </form>
  </dialog>

  <!-- カテゴリー名の追加・変更・削除を行う管理画面 -->
  <dialog id="categoryDialog">
    <form id="categoryForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">ORGANIZE</p>
          <h2>カテゴリーを編集</h2>
        </div>
        <button type="button" id="closeCategoriesBtn" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <!-- 新しいカテゴリー名を入力して追加 -->
      <div class="category-add-row">
        <input id="newCategoryInput" maxlength="40" placeholder="新しいカテゴリー名">
        <button type="button" id="addCategoryBtn" class="primary">追加</button>
      </div>
      <!-- JavaScriptが編集・削除ボタン付きの一覧を描画 -->
      <div id="categoryManagerList" class="category-manager-list"></div>
      <div class="dialog-actions">
        <span class="grow"></span>
        <button type="button" id="doneCategoriesBtn" class="primary">完了</button>
      </div>
    </form>
  </dialog>

  <!-- 操作結果などを一時表示するメッセージ -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- 動作を担当するJavaScriptを読み込む -->
  <script src="app.js"></script>
</body>
</html>
